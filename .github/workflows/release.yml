name: Release

# Push a tag like v0.2.1 (matching the root package.json "version", the release number) to publish a release.
# Every release contains both products, each with its own version; the stores skip versions they already have.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check tag matches the release number
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi

      - run: node tools/build.mjs
      - run: npx --yes @vscode/vsce@3 package -o ../dist/
        working-directory: vscode

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extension=$(node -p "require('./vscode/package.json').version")
          module=$(grep -oP "ModuleVersion\s*=\s*'\K[0-9.]+" powershell/RetroLooks/RetroLooks.psd1)
          notes="VS Code extension **$extension** ([changelog](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/vscode/CHANGELOG.md)), PowerShell module **$module** ([changelog](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/powershell/CHANGELOG.md))."
          gh release create "$GITHUB_REF_NAME" --title "Retro Looks $GITHUB_REF_NAME" --notes "$notes" --generate-notes \
            dist/*.vsix dist/retro-looks-powershell.zip dist/retro-looks-powershell.zip.sha256 powershell/install.ps1

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3 publish --skip-duplicate --packagePath dist/*.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish --skip-duplicate dist/*.vsix -p "$OVSX_PAT"
