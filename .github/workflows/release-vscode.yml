name: Release VS Code extension

# Push a tag like vscode-v1.2.3, matching "version" in vscode/package.json, to release the extension.
# Its release is never marked "latest": that's the PowerShell module's, which install.ps1 downloads.
# A tag with a suffix, like vscode-v1.2.3-rc.1, is a test release: a GitHub pre-release only, never
# published to the Marketplace or Open VSX.
on:
  push:
    tags: ['vscode-v*']

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the tag matches the extension's version
        run: |
          version=$(node -p "require('./vscode/package.json').version")
          node tools/release-tag.mjs vscode "$GITHUB_REF_NAME" "$version" >> "$GITHUB_ENV"

      - run: node tools/build.mjs
      - run: npx --yes @vscode/vsce@3 package -o ../dist/
        working-directory: vscode

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/release-notes.mjs vscode/CHANGELOG.md "$VERSION" > release-notes.md
          prerelease=$([ "$PRERELEASE" = true ] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --title "Degauss for VS Code $RELEASE_NAME" \
            --notes-file release-notes.md --latest=false $prerelease dist/*.vsix

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != '' && env.PRERELEASE == 'false'
        run: npx --yes @vscode/vsce@3 publish --skip-duplicate --packagePath dist/*.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != '' && env.PRERELEASE == 'false'
        run: npx --yes ovsx publish --skip-duplicate dist/*.vsix -p "$OVSX_PAT"
