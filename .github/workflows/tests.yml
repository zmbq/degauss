name: Tests

# Called by the Build and Release workflows.
on:
  workflow_call:

jobs:
  linux:
    name: Build and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  windows:
    name: Build and tests (Windows), PowerShell module
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: pwsh -NoProfile -File tests/powershell/Degauss.tests.ps1
