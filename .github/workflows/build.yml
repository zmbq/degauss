name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/build.mjs
      - run: npx --yes @vscode/vsce@3 package -o ../dist/
        working-directory: extension
      - uses: actions/upload-artifact@v7
        with:
          name: retro-looks
          path: dist/*.*
